<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .banner{
            border: 1px solid black;
            height: 950px;

            background-color: bisque;
            background-image: url('https://images.pexels.com/photos/25857614/pexels-photo-25857614.jpeg') ;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;/* to fix the image to background*/

            display: flex;
            justify-content: center;
            align-items: center;

            filter: blur(2px);

        }
        h1{
            color: white;
            font-size: 80px;  
            letter-spacing: 10px;
            text-shadow:0px 10px 10px black ;
            text-weigth: 100px;
            
        }
    </style>
</head>
<body>
    <div class="banner">
       <h1>Netflix</h1> 
    </div>
</body>
</html>
