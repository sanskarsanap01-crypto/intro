<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color: red;
        }
        #sam{
            display: none;/* to hide something we use this */
        }
        #ex1{
            background-color: blue;
            display: inline;/* it continues the world or senternce hence we use inline */
        }
         #ex2{
            background-color: aqua;
            display: block;/* no world or sentence we can write in that line hence er use block */
        }

    </style>
</head>
<body>
    <p id="sam">hello big billion days are live!!!!</p>

    <div>
        here is an example of inline display- spam tag
        <p id="ex1">hello inline</p>
    </div>

    <div>
        this is the example of block display - - Div tag
        <p id="ex2">hello block</p>
    </div>
</body>
</html>
