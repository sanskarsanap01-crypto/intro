<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- select tag(option) -->
    <select>
        <option>INDIA</option>
        <option>RUSSIA</option>
        <OPTION>CHINA</OPTION>
        <OPTION>CANADA</OPTION>
        <OPTION LABEL="USA">UNITED STATE OF AMERICA</OPTION>
        <OPTION SELECTED DISABLED>COUNTRY</OPTION>    
    </select>

    <select name="menu">
        <option>BREAKFAST</option>
        <option>LUNCH</option>
        <option>DINNER</option>
    </select>

     <select name="cities" required>
        <option>delhi</option>
        <option>mimbai</option>
    </select>

    <select name="cities" disabled>
        <option>delhi</option>
        <option>mimbai</option>
    </select>

     <select name="cities" multiple>
        <option>delhi</option>
        <option>mimbai</option>
        <option>banglore</option>
    </select>
<!-- button tag -->
    <button>selected</button>
<!-- detail tag (info) -->
    <details>
        <summary>sanskar</summary>
        <p>first year computer engineer</p>
    </details>
<!-- progress meter tag (loading bar) -->
    <progress value="80" max="100"></progress>
    <meter value="50"  max="100"></meter>
    <!-- marquee tag -->
    <marquee>
        hello!
    </marquee>
<!-- date time tag -->
    <p>
        <time datetime="20/10/2026">
            september 20 2026
        </time>
    </p>
<!-- dialog tag -->
    <dialog open>
        hi, sanskar how are you
    </dialog>
<!-- tablt tag -->
    <table border="1" cellspacing="10" cellpaddind="10" align="right" bgcolor="yellow">
        <thead align="center" bgcolor="red">
            <tr>
                <th>name</th>
                <th>designation</th>
                <th>city</th>
            </tr>
        </thead>

        <tbody align="center" bgcolor="green">
            <tr>
                <td>sanskar</td>
                <td>frontend</td>
                <td>mumbai</td>
            </tr>
            <tr>
                <td>samruddhi</td>
                <td>backend</td>
                <td>panvel</td>
            </tr>
        </tbody>

        </table>
<!-- list tag -->
        <ol >
            <li>paneer</li>
            <li>ladies finger</li>
            <li>ice cream</li>
        </ol>

        <ul >
            <li>lion</li>
            <li>deer</li>
            <li>elephant</li>
        </ul>
        
    

</body>
</html>
