<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //variable - it is like box in which we store data
        //only one value is stored at a time

        // syntax: key(let , const) VariableName = value

        //1. let: when data needs to change or update

        let username = "sanskar"

        let city = "mumbai"
        city = "banglore"

        console.log(city)
        console.log(username)

        //2. const : measns it will never change , never update

        const appname = "amazon"
        console.log(appname)

    </script>
</body>
</html>
