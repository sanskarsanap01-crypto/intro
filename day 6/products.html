<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .product{
            border: 1px solid black;
            border-radius: 15px;
            padding:20px;
            margin-bottom:20px;
            text-align: center;
            margin: auto;
            background-color: bisque;
            

            /* box-shadow: 4px 0 0 black; */
            /* box-shadow: 4px 4px 0 black; */
            box-shadow: 4px 4px 8px black;
            width: 500px;
        }
        .product img{
            width:400px ;
            height:200px ;
            object-fit:cover ;
            border-radius: 15px;

        }

        .product:hover{
            background-color: orangered;
            color: white;
            transition: 1s;
        }
    </style>
</head>
<body>
    <H3>ELECTRONICS</H3>
    <HR>
    <div class="product">
        <img src="https://images.pexels.com/photos/3081173/pexels-photo-3081173.jpeg" alt="headphones" height="200" width="300">
        <h2>headphones</h2>
        <p>Rs 2,499</p>
        <button>Buy now</button>

    </div>

    <div class="product">
        <img src="https://images.pexels.com/photos/18533790/pexels-photo-18533790.jpeg" alt="mobile"  height="200" width="300">
        <h2>mobile</h2>
        <p>Rs 26,499</p>
        <button>Buy now</button>

    </div>

    <div class="product">
        <img src="https://images.pexels.com/photos/4917455/pexels-photo-4917455.jpeg" alt="speakers"  height="200" width="300">
        <h2>speakers</h2>
        <p>Rs 30,499</p>
        <button>Buy now</button>

    </div>
</body>
</html>
