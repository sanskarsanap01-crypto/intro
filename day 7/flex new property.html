<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: bisque;
            height: 120px;
            width: 120px;
        }
        .box:hover{
            /* transform: translateX(200px); we can use this property only one time*/
            transition: 3s;
        transform: scale(1.4);
            background-color: blue;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
